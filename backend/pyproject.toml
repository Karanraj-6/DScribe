[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-admission-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "supabase>=2.10,<3", "python-dotenv>=1.0,<2", "pg8000>=1.31,<2"]
